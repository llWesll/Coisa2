name: Build Inotia4 ModMenu

on:
  workflow_dispatch:
    inputs:
      with_mod:
        description: "Injetar o mod menu? (false = so mesclar e reassinar, teste de sanidade)"
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      KS_PASS: modmenu
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Obter o APKM (pasta input ou Release "apk")
        run: |
          mkdir -p input
          if [ ! -f input/inotia4.apkm ]; then
            echo "Baixando inotia4.apkm da Release 'apk'..."
            gh release download apk --repo "${{ github.repository }}" --pattern 'inotia4.apkm' --dir input \
              || { echo "::error::Sem input/inotia4.apkm e sem Release 'apk' com o arquivo inotia4.apkm"; exit 1; }
          fi
          ls -la input

      - name: Preparar ferramentas
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          AJ=$(ls -d "$ANDROID_HOME"/platforms/android-* | sort -V | tail -1)/android.jar
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          echo "BT=$BT" >> $GITHUB_ENV
          echo "AJ=$AJ" >> $GITHUB_ENV
          echo "NDK=$NDK" >> $GITHUB_ENV
          echo "build-tools=$BT android.jar=$AJ ndk=$NDK"
          mkdir -p tools work
          gh release download --repo REAndroid/APKEditor --pattern 'APKEditor-*.jar' --dir tools
          gh release download --repo iBotPeaches/Apktool --pattern 'apktool_*.jar' --dir tools
          mv tools/APKEditor-*.jar tools/APKEditor.jar
          mv tools/apktool_*.jar tools/apktool.jar
          ls -la tools

      - name: Keystore (reaproveitada entre builds)
        uses: actions/cache@v4
        with:
          path: ks
          key: mod-keystore-v1

      - name: Criar keystore se nao existir
        run: |
          mkdir -p ks
          if [ ! -f ks/mod.jks ]; then
            keytool -genkeypair -keystore ks/mod.jks -storepass "$KS_PASS" -keypass "$KS_PASS" \
              -alias mod -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=ModMenu"
          fi

      - name: Mesclar APKM em um unico APK
        run: |
          java -jar tools/APKEditor.jar m -i input/inotia4.apkm -o work/merged.apk \
          || { mkdir -p work/splits && unzip -oq input/inotia4.apkm '*.apk' -d work/splits \
               && java -jar tools/APKEditor.jar m -i work/splits -o work/merged.apk; }
          ls -la work/merged.apk

      - name: Compilar libmodmenu.so (arm64)
        if: ${{ inputs.with_mod }}
        run: |
          cmake -S jni -B work/jni -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-23 -DCMAKE_BUILD_TYPE=Release
          cmake --build work/jni
          ls -la work/jni/libmodmenu.so

      - name: Compilar ModMenu.java para dex
        if: ${{ inputs.with_mod }}
        run: |
          mkdir -p work/classes work/dexout
          javac --release 8 -classpath "$AJ" -d work/classes java/com/mod/ModMenu.java
          "$BT/d8" --lib "$AJ" --min-api 23 --output work/dexout $(find work/classes -name '*.class')
          ls -la work/dexout

      - name: Decodificar, aplicar patch e recompilar
        if: ${{ inputs.with_mod }}
        run: |
          java -jar tools/apktool.jar d -r -f work/merged.apk -o work/dec
          python3 tools/patch_smali.py work/dec
          java -jar tools/apktool.jar b work/dec -o work/rebuilt.apk
          N=$(unzip -Z1 work/rebuilt.apk | grep -E '^classes[0-9]*\.dex$' | wc -l)
          NEXT=$((N+1))
          echo "dex existentes: $N -> novo: classes$NEXT.dex"
          mkdir -p work/stage/lib/arm64-v8a
          cp work/dexout/classes.dex work/stage/classes$NEXT.dex
          cp work/jni/libmodmenu.so work/stage/lib/arm64-v8a/libmodmenu.so
          (cd work/stage && zip -qr ../rebuilt.apk .)
          cp work/rebuilt.apk work/final_unsigned.apk

      - name: Sem mod (teste de sanidade)
        if: ${{ !inputs.with_mod }}
        run: cp work/merged.apk work/final_unsigned.apk

      - name: Normalizar zip (libs e resources.arsc sem compressao, sem duplicatas)
        run: |
          python3 - <<'PY'
          import zipfile
          src, dst = 'work/final_unsigned.apk', 'work/normalized.apk'
          seen = set()
          with zipfile.ZipFile(src) as zi, zipfile.ZipFile(dst, 'w') as zo:
              for it in zi.infolist():
                  if it.is_dir() or it.filename in seen:
                      continue
                  seen.add(it.filename)
                  stored = it.filename.endswith('.so') or it.filename == 'resources.arsc'
                  zinfo = zipfile.ZipInfo(it.filename, it.date_time)
                  zinfo.external_attr = it.external_attr
                  zo.writestr(zinfo, zi.read(it.filename),
                              zipfile.ZIP_STORED if stored else zipfile.ZIP_DEFLATED)
          PY
          mv work/normalized.apk work/final_unsigned.apk
          unzip -lv work/final_unsigned.apk | grep -E "lib/|resources.arsc|classes[0-9]*.dex" || true

      - name: Alinhar e assinar
        run: |
          "$BT/zipalign" -p -f 4 work/final_unsigned.apk work/aligned.apk
          "$BT/apksigner" sign --ks ks/mod.jks --ks-pass pass:"$KS_PASS" --key-pass pass:"$KS_PASS" \
            --out inotia4-mod.apk work/aligned.apk
          "$BT/apksigner" verify inotia4-mod.apk
          ls -la inotia4-mod.apk

      - uses: actions/upload-artifact@v4
        with:
          name: inotia4-mod
          path: inotia4-mod.apk
          compression-level: 0
